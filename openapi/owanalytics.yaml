  /wifiClientHistory:
    get:
      tags:
        - WiFiClientHistory
      operationId: getWifiClientHistory
      summary: Retrieve WiFi client addresses 
      parameters:
        - in: query
          name: fromDate
          schema:
            type: integer
          required: false
        - in: query
          name: endDate
          schema:
            type: integer
          required: false
        - in: query
          description: Pagination start (starts at 1. If not specified, 1 is assumed)
          name: offset
          schema:
            type: integer
          required: false
        - in: query
          description: Maximum number of entries to return (if absent, no limit is assumed)
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          description: Maximum number of entries to return (if absent, no limit is assumed)
          name: macsOnly
          schema:
            type: boolean
            default: false
          required: false
        - in: query
          description: Maximum number of entries to return (if absent, no limit is assumed)
          name: macFilter
          schema:
            type: string
            example:
              112233445566, 11223344*, *5566
          required: false
        - in: query
          description: Venue for the search. If omitted, boardId may be used to derive it.
          name: venue
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          description: Board used to derive venue when venue is not provided.
          name: boardId
          schema:
            type: string
            format: uuid
          required: false
      responses:
        200:
          description: Return matching client MAC addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacList'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  /wifiClientHistory/{client}:
    get:
      tags:
        - WiFiClientHistory
      operationId: getWifiClientHistoryEntries
      summary: Retrieve WiFi client history per device
      parameters:
        - in: path
          name: client
          schema:
            type: string
            example:
              "112233aabbcc"
          required: true
        - in: query
          name: fromDate
          schema:
            type: integer
          required: false
        - in: query
          name: endDate
          schema:
            type: integer
          required: false
        - in: query
          description: Pagination start (starts at 1. If not specified, 1 is assumed)
          name: offset
          schema:
            type: integer
          required: false
        - in: query
          description: Maximum number of entries to return (if absent, no limit is assumed)
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          description: Venue for the search. If omitted, boardId may be used to derive it.
          name: venue
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          description: Board used to derive venue when venue is not provided.
          name: boardId
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          description: return extended information
          name: orderBy
          schema:
            type: string
            example: serialNumber:a,created:d
          required: false
        - in: query
          description: return extended information
          name: orderSpec
          schema:
            type: boolean
            default: false
          required: false
        - in: query
          description: Return count only
          name: countOnly
          schema:
            type: boolean
          required: false
      responses:
        200:
          description: Return WiFi client history entries per device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiClientHistoryList'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - WiFiClientHistory
      operationId: deleteWifiClientHistory
      summary: Delete WiFi client history per device
      parameters:
        - in: query
          description: The venue to for the search.
          name: venue
          schema:
            type: string
            format: uuid
          required: true
        - in: path
          name: client
          schema:
            type: string
            example:
              "112233aabbcc"
          required: true
        - in: query
          name: fromDate
          schema:
            type: integer
          required: false
        - in: query
          name: endDate
          schema:
            type: integer
          required: false
      responses:
        200:
          $ref: '#/components/responses/Success'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  #########################################################################################
  ##
  ## These are endpoints that all services in the OpenWiFi stack must provide
  ##
  #########################################################################################
  /system:
    post:
      tags:
        - System Commands
      summary: Perform some system wide commands.
      operationId: systemCommand
      requestBody:
        description: Command details
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SystemCommandSetLogLevel'
                - $ref: '#/components/schemas/SystemCommandReload'
                - $ref: '#/components/schemas/SystemCommandGetLogLevels'
                - $ref: '#/components/schemas/SystemCommandGetLogLevelNames'
                - $ref: '#/components/schemas/SystemCommandGetSubsystemNames'
      responses:
        200:
          description: Successful command execution
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SystemGetLogLevelsResult'
                  - $ref: '#/components/schemas/SystemCommandGetLogLevelNamesResult'
                  - $ref: '#/components/schemas/SystemGetSubSystemNamesResult'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - System Commands
      summary: Retrieve different values from the running service.
      operationId: getSystemCommand
      parameters:
        - in: query
          description: Get a value
          name: command
          schema:
            type: string
            enum:
              - info
              - extraConfiguration
              - resources
          required: true
      responses:
        200:
          description: Return the requested system information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCommandResults'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  /systemConfiguration:
    get:
      tags:
        - SystemConfiguration
      summary: Retrieve system configuration items
      operationId: getSystemConfiguration
      parameters:
        - in: query
          description: Which parameters you want to retrieve
          name: entries
          schema:
            type: string
            example:
              - element1
              - element1,element2,element3
          required: true
      responses:
        200:
          description: List of configuration elements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtraSystemConfiguration'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
