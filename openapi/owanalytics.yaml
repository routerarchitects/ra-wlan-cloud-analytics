        error:
          type: string
          enum:
            - radio_temperature_summary_query_failed
            - internal_error
        message:
          type: string

    WifiClientUsageInternalError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - wifi_client_usage_query_failed
            - internal_error
        message:
          type: string

    WifiClientRssiInternalError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - wifi_client_rssi_query_failed
            - internal_error
        message:
          type: string

    AvailabilityInternalError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - availability_query_failed
            - internal_error
        message:
          type: string

    GatewayMemorySummary:
      type: object
      description: >
        Gateway free memory summary in bytes. Memory statistics are arithmetic aggregations of
        stored memory_free samples whose timestamps fall within the requested half-open window.
        They are not time-weighted. When samples exist, all values are nonnegative and satisfy
        min_memfree <= avg_memfree <= max_memfree. When no valid memory samples exist, all fields are null.
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - min_memfree
            - max_memfree
            - avg_memfree
            - latest_memfree
          properties:
            min_memfree:
              type: integer
              minimum: 0
              nullable: true
              description: Minimum reported free memory in bytes for the requested aggregation window.
            max_memfree:
              type: integer
              minimum: 0
              nullable: true
              description: Maximum reported free memory in bytes for the requested aggregation window.
            avg_memfree:
              type: integer
              minimum: 0
              nullable: true
              description: Rounded integer average of reported free-memory samples in bytes for the requested aggregation window.
            latest_memfree:
              type: integer
              minimum: 0
              nullable: true
              description: Free memory in bytes from the latest valid sample by timestamp in the requested aggregation window.
        meta:
          type: object
          required:
            - requestedWindow
            - observedWindow
          properties:
            requestedWindow:
              $ref: '#/components/schemas/RequestedWindow'
            observedWindow:
              $ref: '#/components/schemas/ObservedWindow'

    GatewayWifiTemperatureSummary:
      type: object
      description: >
        Wi-Fi radio temperature summary. The 2.4 GHz JSON property names intentionally use
        the dotted `2.4G` suffix to match the MCP API wire contract; clients should treat
        these as literal JSON keys, not property paths. Temperature statistics are arithmetic
        aggregations of valid radio temperature samples whose timestamps fall within the
        requested half-open window. Null applies independently per band when that band has no valid
        temperature samples. A valid radio temperature sample is a present Celsius value where
        -40 <= temperature <= 125 and temperature != 255.
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - min_wifi_temp_2.4G
            - max_wifi_temp_2.4G
            - avg_wifi_temp_2.4G
            - latest_wifi_temp_2.4G
            - min_wifi_temp_5G
            - max_wifi_temp_5G
            - avg_wifi_temp_5G
            - latest_wifi_temp_5G
          properties:
            min_wifi_temp_2.4G:
              type: number
              format: double
              nullable: true
              description: Minimum reported 2.4 GHz Wi-Fi radio temperature in degrees Celsius.
            max_wifi_temp_2.4G:
              type: number
              format: double
              nullable: true
              description: Maximum reported 2.4 GHz Wi-Fi radio temperature in degrees Celsius.
            avg_wifi_temp_2.4G:
              type: number
              format: double
              nullable: true
              description: Arithmetic average of reported 2.4 GHz Wi-Fi radio temperature samples rounded to 2 decimal places.
            latest_wifi_temp_2.4G:
              type: number
              format: double
              nullable: true
              description: Latest reported 2.4 GHz Wi-Fi radio temperature sample by timestamp.
            min_wifi_temp_5G:
              type: number
              format: double
              nullable: true
              description: Minimum reported 5 GHz Wi-Fi radio temperature in degrees Celsius.
            max_wifi_temp_5G:
              type: number
              format: double
              nullable: true
              description: Maximum reported 5 GHz Wi-Fi radio temperature in degrees Celsius.
            avg_wifi_temp_5G:
              type: number
              format: double
              nullable: true
              description: Arithmetic average of reported 5 GHz Wi-Fi radio temperature samples rounded to 2 decimal places.
            latest_wifi_temp_5G:
              type: number
              format: double
              nullable: true
              description: Latest reported 5 GHz Wi-Fi radio temperature sample by timestamp.
        meta:
          type: object
          required:
            - requestedWindow
            - observedWindow
          properties:
            requestedWindow:
              $ref: '#/components/schemas/RequestedWindow'
            observedWindow:
              $ref: '#/components/schemas/ObservedWindow'

    ClientBandwidthConsumption:
      type: object
      description: >
        Per-client usage totals. Raw byte counters are authoritative; total_bytes is always
        rx_bytes + tx_bytes. Formatted string fields are display-only decimal megabytes using
        bytes / 1,000,000, formatted with standard floating point two decimal places
        and the literal " MB" suffix.
      required:
        - mac
        - rx_bytes
        - tx_bytes
        - total_bytes
        - data_consume_rx
        - data_consume_tx
        - total_data_usage
      properties:
        mac:
          $ref: '#/components/schemas/MacAddress'
        rx_bytes:
          type: integer
          minimum: 0
        tx_bytes:
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          minimum: 0
        data_consume_rx:
          type: string
          example: 106.49 MB
        data_consume_tx:
          type: string
          example: 3.85 MB
        total_data_usage:
          type: string
          example: 110.34 MB

    ClientBandwidthConsumptionResponse:
      type: object
      description: >
        Wrapped Wi-Fi usage differential summary calculated from persisted samples currently
        available to Analytics.
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - items
            - totalClients
            - truncated
          properties:
            items:
              type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/ClientBandwidthConsumption'
            totalClients:
              type: integer
              minimum: 0
            truncated:
              type: boolean
        meta:
          type: object
          required:
            - requestedWindow
            - observedWindow
          properties:
            requestedWindow:
              $ref: '#/components/schemas/RequestedWindow'
            observedWindow:
              $ref: '#/components/schemas/ObservedWindow'

    ClientRssiQuality:
      type: object
      description: >
        Per-client RSSI quality percentages calculated from valid RSSI samples only (-127 <= RSSI < 0). RSSI
        categories use dBm thresholds: excellent is RSSI >= -55, good is -67 <= RSSI < -55,
        fair is -75 <= RSSI < -67, and poor is RSSI < -75.
      required:
        - mac
        - rssi_excellent_pct
        - rssi_good_pct
        - rssi_fair_pct
        - rssi_poor_pct
        - rssi_total_samples
      properties:
        mac:
          $ref: '#/components/schemas/MacAddress'
        rssi_excellent_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of valid RSSI samples where RSSI >= -55 dBm.
        rssi_good_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of valid RSSI samples where -67 dBm <= RSSI < -55 dBm.
        rssi_fair_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of valid RSSI samples where -75 dBm <= RSSI < -67 dBm.
        rssi_poor_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of valid RSSI samples where -127 dBm <= RSSI < -75 dBm.
        rssi_total_samples:
          type: integer
          format: int64
          minimum: 1
          description: Number of valid RSSI samples used as denominator for percentages.

    ClientRssiQualityResponse:
      type: object
      description: >
        Wrapped RSSI quality summary.
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - items
            - totalClients
            - truncated
          properties:
            items:
              type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/ClientRssiQuality'
            totalClients:
              type: integer
              minimum: 0
            truncated:
              type: boolean
        meta:
          type: object
          required:
            - requestedWindow
            - observedWindow
          properties:
            requestedWindow:
              $ref: '#/components/schemas/RequestedWindow'
            observedWindow:
              $ref: '#/components/schemas/ObservedWindow'

    GatewayAvailabilityMeta:
      type: object
      description: Metadata for observed persisted availability events used by the response.
      required:
        - requestedWindow
        - observedWindow
        - offlineEventCount
      properties:
        requestedWindow:
          $ref: '#/components/schemas/RequestedWindow'
        observedWindow:
          $ref: '#/components/schemas/ObservedWindow'
        offlineEventCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of persisted offline transition rows contributing to offline_count.

    GatewayAvailabilityData:
      type: object
      description: Gateway offline transition count calculated from persisted availability events.
      required:
        - gw_uuid
        - fetch_status
        - offline_count
      properties:
        gw_uuid:
          $ref: '#/components/schemas/RouterId'
        fetch_status:
          type: string
          enum:
            - success
          description: Status string for availability data retrieval; always "success" in HTTP 200 responses.
          example: success
        offline_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of persisted offline transition rows currently available in Analytics storage for the requested half-open interval.

    GatewayAvailabilitySummaryResponse:
      type: object
      description: >
        Wrapped gateway availability summary response. The endpoint counts persisted offline
        transition rows in device_availability_events for the requested interval and reports the
        observed event-time window for those rows.
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/GatewayAvailabilityMeta'
        data:
          $ref: '#/components/schemas/GatewayAvailabilityData'

    SystemCommandDetails:
      type: object
      properties:
        command:
          type: string
          enum:
            - setloglevels
            - getloglevels
            - getSubSystemNames
            - getLogLevelNames
            - stats
        parameters:
          oneOf:
            - $ref: '#/components/schemas/StringList'
            - $ref: '#/components/schemas/TagValuePairList'

    NoteInfo:
      type: object
      properties:
        created:
          type: integer
          format: int64
        createdBy:
          type: string
        note:
          type: string

    SystemInfoResults:
      type: object
      properties:
        version:
          type: string
        uptime:
          type: integer
          format: int64
        start:
          type: integer
          format: int64
        os:
          type: string
        processors:
          type: integer
        hostname:
          type: string
        certificates:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              expires:
                type: integer
                format: int64

    SystemResources:
      type: object
      properties:
        numberOfFileDescriptors:
          type: integer
          format: int64
        currRealMem:
          type: integer
          format: int64
        peakRealMem:
          type: integer
          format: int64
        currVirtMem:
          type: integer
          format: int64
        peakVirtMem:
          type: integer
          format: int64

    SystemCommandResults:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SystemResources'
        - $ref: '#/components/schemas/SystemInfoResults'
        - $ref: '#/components/schemas/StringList'
        - $ref: '#/components/schemas/TagValuePairList'
        - $ref: '#/components/schemas/ExtraConfigurationStatus' 

    Dashboard:
      type: object
      properties:
        snapshot:
          type: integer
          format: int64
        tenants:
          $ref: '#/components/schemas/TagIntPairList'

    SystemCommandSetLogLevel:
      type: object
      properties:
        command:
          type: string
          enum:
            - setloglevel
        subsystems:
          type: array
          items:
            $ref: '#/components/schemas/TagValuePair'

    SystemCommandReload:
      type: object
      properties:
        command:
          type: string
          enum:
            - reload
        subsystems:
          type: array
          items:
            type: string
            example: these are the SubSystems names retrieve with the GetSubSystemsNamesResult.

    SystemCommandGetLogLevels:
      type: object
      properties:
        command:
          type: string
          enum:
            - getloglevels

    SystemGetLogLevelsResult:
      type: object
      properties:
        taglist:
          type: array
          items:
            $ref: '#/components/schemas/TagValuePair'

    SystemCommandGetLogLevelNames:
      type: object
      properties:
        command:
          type: string
          enum:
            - getloglevelnames

    SystemCommandGetSubsystemNames:
      type: object
      properties:
        command:
          type: string
          enum:
            - getsubsystemnames

    SystemCommandGetLogLevelNamesResult:
      type: object
      properties:
        list:
          type: array
          items:
            type: string

    SystemGetSubSystemNamesResult:
      type: object
      properties:
        list:
          type: array
          items:
            type: string

paths:
  /boards:
    get:
      tags:
        - Boards
      operationId: getBoards
      summary: Retrieve a list of boards.
      parameters:
        - in: query
          description: Pagination start (starts at 1. If not specified, 1 is assumed)
          name: offset
          schema:
            type: integer
          required: false
        - in: query
          description: Maximum number of entries to return (if absent, no limit is assumed)
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          description: Filter the results
          name: filter
          schema:
            type: string
          required: false
        - in: query
          description: return the number of boards
          name: countOnly
          schema:
            type: boolean
          required: false
        - in: query
          description: list of boards for a given venue
          name: forVenue
          schema:
            type: string
            format: uuid
          required: false
      responses:
        200:
          description: Return a list of boards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardInfoList'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  /board/{id}:
    get:
      tags:
        - Boards
      operationId: getBoard
      summary: Retrieve a board
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        200:
          description: Return a list of boards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardInfo'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Boards
      operationId: deleteBoard
      summary: Remove a board
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        200:
          $ref: '#/components/responses/Success'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Boards
      operationId: createBoard
      summary: Create a board
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          example: value should be 0 for a post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardInfo'
      responses:
        200:
          description: Return the created board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardInfo'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Boards
      operationId: modifyBoard
      summary: Modify a board
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardInfo'
      responses:
        200:
          description: Return the updated board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardInfo'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  /board/{id}/devices:
    get:
      tags:
        - Board Devices
      summary: Get basic information about all the devices for a venue.
      operationId: getBoardDevices
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true

      responses:
        200:
          description: Return device information for the board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfoList'
        400:
          $ref: '#/components/responses/BadRequest'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  /devices/{routerId}/memory-summary:
    get:
      tags:
        - Device Metrics
      operationId: getGatewayMemorySummary
      summary: Retrieve gateway free memory summary for a lookback window.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RouterIdPath'
        - $ref: '#/components/parameters/TimestampTill'
        - $ref: '#/components/parameters/LookbackHours'
      responses:
        200:
          description: Return gateway free memory summary for the requested aggregation window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayMemorySummary'
              examples:
                withSamples:
                  value:
                    data:
                      avg_memfree: 27083337
                      max_memfree: 36204544
                      min_memfree: 21196800
                      latest_memfree: 25731072
                    meta:
                      requestedWindow:
                        startTime: "2026-07-26T12:00:00Z"
                        endTime: "2026-07-27T12:00:00Z"
                      observedWindow:
                        startTime: "2026-07-26T12:03:00Z"
                        endTime: "2026-07-27T11:57:00Z"
                noSamples:
                  value:
                    data:
                      avg_memfree: null
                      max_memfree: null
                      min_memfree: null
                      latest_memfree: null
                    meta:
                      requestedWindow:
                        startTime: "2026-07-26T12:00:00Z"
                        endTime: "2026-07-27T12:00:00Z"
                      observedWindow:
                        startTime: null
                        endTime: null
        400:
          $ref: '#/components/responses/CommonAnalyticsBadRequest'
        401:
          $ref: '#/components/responses/AnalyticsUnauthorized'
        403:
          $ref: '#/components/responses/AnalyticsForbidden'
        404:
          $ref: '#/components/responses/AnalyticsNotFound'
        409:
          $ref: '#/components/responses/AnalyticsConflict'
        500:
          $ref: '#/components/responses/MemorySummaryInternalError'
        502:
          $ref: '#/components/responses/AnalyticsBadGateway'

  /devices/{routerId}/radio-temperature-summary:
    get:
      tags:
        - Device Metrics
      operationId: getGatewayRadioTemperatureSummary
      summary: Retrieve gateway Wi-Fi radio temperature summary for a lookback window.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RouterIdPath'
        - $ref: '#/components/parameters/TimestampTill'
        - $ref: '#/components/parameters/LookbackHours'
      responses:
        200:
          description: Return Wi-Fi radio temperature summary for the requested aggregation window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayWifiTemperatureSummary'
              examples:
                withSamples:
                  value:
                    data:
                      avg_wifi_temp_2.4G: 54.77
                      avg_wifi_temp_5G: 54.77
                      max_wifi_temp_2.4G: 55
                      max_wifi_temp_5G: 55
                      min_wifi_temp_2.4G: 53
                      min_wifi_temp_5G: 53
                      latest_wifi_temp_2.4G: 55
                      latest_wifi_temp_5G: 54
                    meta:
